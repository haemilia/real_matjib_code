[project]
name = "real-matjib-code"
version = "0.1.0"
description = "Finding the real matjib, AKA good restaurants"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "beautifulsoup4==4.13.4",
    "boto3==1.38.44",
    "duckdb==1.3.0",
    "fastparquet==2024.11.0",
    "geopy>=2.4.1",
    "google-genai>=1.24.0",
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
    "ko-core-news-md",
    "matplotlib>=3.10.3",
    "openpyxl==3.1.5",
    "pandas==2.3.0",
    "pathlib==1.0.1",
    "plotly==6.1.2",
    "pyarrow==20.0.0",
    "pyproj>=3.7.1",
    "python-dotenv==1.1.0",
    "requests==2.32.4",
    "requests-cache==1.2.1",
    "scikit-learn==1.7.0",
    "selenium==4.33.0",
    "soynlp==0.0.493",
    "spacy>=3.8.7",
    "streamlit==1.46.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "tqdm==4.67.1",
    "transformers==4.52.4",
    "wandb==0.20.1",
    "webdriver-manager==4.0.2",
    "wordcloud>=1.9.4",
]

[dependency-groups]
dev = [
    "mypy>=1.16.0",
    "pandas-stubs==2.2.3.250527",
    "ruff>=0.11.13",
    "types-pyyaml==6.0.12.20250516",
    "types-requests==2.32.4.20250611",
    "types-tqdm==4.67.0.20250516",
]

[tool.uv.sources]
ko-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/ko_core_news_md-3.8.0/ko_core_news_md-3.8.0-py3-none-any.whl" }
